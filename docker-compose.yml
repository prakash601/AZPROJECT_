services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: azproject-db
    environment:
      POSTGRES_DB: azproject
      POSTGRES_USER: azuser
      POSTGRES_PASSWORD: azpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azuser -d azproject"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
